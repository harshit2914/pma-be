name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Automated review on every PR open / push
  # This job name is used as the required status check in branch protection.
  # ─────────────────────────────────────────────────────────────────────────────
  claude-code-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Delegates to the code-reviewer subagent defined in .claude/agents/code-reviewer.md
          direct_prompt: |
            Use the code-reviewer agent to review this pull request.

            Context for this repo (Flint backend — Node.js/Express, MongoDB, Azure):
            - Standard response shape must be { success, message, data }
            - Passwords must be hashed with bcrypt or argon2 — never plaintext
            - Secrets and connection strings must come from env vars — never hardcoded
            - All async route handlers must have try/catch with next(err)
            - Mongoose schemas require createdAt and updatedAt
            - Public endpoints must be rate-limited
            - List endpoints must support pagination

            Post a single structured PR comment with:
            - A summary of overall quality and risk
            - Each finding labeled CRITICAL | HIGH | MEDIUM | LOW | NIT with file:line and a fix suggestion
            - A final verdict: APPROVE / REQUEST CHANGES / NEEDS DISCUSSION

  # ─────────────────────────────────────────────────────────────────────────────
  # On-demand: comment "@claude review" on any PR to re-trigger
  # ─────────────────────────────────────────────────────────────────────────────
  claude-on-demand-review:
    name: Claude On-Demand Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review')
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            A team member has requested a fresh review. Use the code-reviewer agent to review
            this pull request using the full checklist including security, correctness,
            performance, database patterns, and API design.

            Context: Flint backend (Node.js/Express, MongoDB, Azure).
            Enforce: { success, message, data } response shape, bcrypt/argon2 passwords,
            env-var secrets, try/catch on all async handlers, paginated list endpoints.

            Post a structured comment with severity-labeled findings and a final verdict.