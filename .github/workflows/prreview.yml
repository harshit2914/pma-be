name: Groq PR Review
# Model: llama-3.3-70b-versatile 
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
jobs:
  groq-code-review:
    name: Groq Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure review labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "review: high"        --color "b60205" --description "CRITICAL - PR blocked"     --repo ${{ github.repository }} --force
          gh label create "review: medium-high" --color "e05d44" --description "HIGH - PR blocked"         --repo ${{ github.repository }} --force
          gh label create "review: medium-low"  --color "f4a224" --description "MEDIUM - warning only"     --repo ${{ github.repository }} --force
          gh label create "review: low"         --color "0075ca" --description "LOW - ok to merge"         --repo ${{ github.repository }} --force
          gh label create "review: approved"    --color "0e8a16" --description "No issues - good to merge" --repo ${{ github.repository }} --force
      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr_diff.txt
          echo "Diff saved."
      - name: Write review script
        run: |
          cat > review.js << 'EOF'
          const fs = require('fs');
          const https = require('https');
          const diff = fs.readFileSync('pr_diff.txt', 'utf8').slice(0, 28000);
          const prompt = 'You are a senior code reviewer. Review the following PR diff carefully.\n\n'
            + 'For EACH issue found, output it in EXACTLY this format (one issue per line):\n'
            + '[SEVERITY] filename:lineNumber — description of what is wrong + how to fix it\n\n'
            + 'Rules:\n'
            + '- SEVERITY must be one of: CRITICAL, HIGH, MEDIUM, LOW\n'
            + '- filename must be the exact file path from the diff (e.g. controllers/tasks.js)\n'
            + '- lineNumber must be the line number in the diff where the issue occurs\n'
            + '- The description must explain WHAT is wrong AND give a concrete fix (show corrected code inline if short, or describe the exact change)\n'
            + '- Do NOT write paragraphs, summaries, or prose. One line per issue only.\n\n'
            + 'Severity definitions:\n'
            + '- CRITICAL = hardcoded secrets, credentials committed\n'
            + '- HIGH     = missing try/catch on async, unhandled promise, missing auth middleware, password not hashed\n'
            + '- MEDIUM   = no rate limiting on public route, no pagination, N+1 query, missing response helper\n'
            + '- LOW      = console.log in production, TODO comment, magic number, deprecated method\n\n'
            + 'Example output:\n'
            + '[HIGH] controllers/tasks.js:58 — deleteTask async function is missing a catch block; unhandled errors will crash the server. Fix: restore } catch (err) { console.error(err); res.status(500).json({ message: "Server error" }); } after the try block.\n'
            + '[MEDIUM] routes/auth.js:12 — POST /login has no rate limiter, allowing brute-force attacks. Fix: add rateLimiter middleware: router.post("/login", rateLimiter, authController.login)\n\n'
            + 'If no issues are found, write exactly: No issues found.\n\n'
            + 'On the VERY LAST LINE of your response, output exactly one of these labels (nothing else on that line):\n'
            + 'review: high\n'
            + 'review: medium-high\n'
            + 'review: medium-low\n'
            + 'review: low\n'
            + 'review: approved\n\n'
            + 'Where:\n'
            + '- review: high        = any CRITICAL issue found\n'
            + '- review: medium-high = highest severity is HIGH\n'
            + '- review: medium-low  = highest severity is MEDIUM\n'
            + '- review: low         = only LOW issues found\n'
            + '- review: approved    = no issues found\n\n'
            + 'PR Diff:\n```\n' + diff + '\n```';
          const body = JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.2,
            max_tokens: 2048
          });
          const options = {
            hostname: 'api.groq.com',
            path: '/openai/v1/chat/completions',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + process.env.GROQ_API_KEY,
              'Content-Length': Buffer.byteLength(body)
            }
          };
          const req = https.request(options, function(res) {
            let data = '';
            res.on('data', function(chunk) { data += chunk; });
            res.on('end', function() {
              try {
                const parsed = JSON.parse(data);
                const review = parsed.choices[0].message.content;
                if (!review) { console.error('No review text:', data); process.exit(1); }
                const lines = review.trim().split('\n').filter(function(l) { return l.trim(); });
                const lastLine = lines[lines.length - 1].trim();
                const validLabels = ['review: high', 'review: medium-high', 'review: medium-low', 'review: low', 'review: approved'];
                const label = validLabels.find(function(l) { return lastLine.includes(l); }) || 'review: low';
                fs.writeFileSync('review_comment.txt', review);
                fs.writeFileSync('review_label.txt', label);
                console.log('Review complete. Label: ' + label);
              } catch(e) {
                console.error('Parse error:', e, data);
                process.exit(1);
              }
            });
          });
          req.on('error', function(e) { console.error(e); process.exit(1); });
          req.write(body);
          req.end();
          EOF
      - name: Review PR with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node review.js
      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file review_comment.txt
      - name: Apply severity label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL=$(cat review_label.txt)
          echo "Applying label: $LABEL"
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "review: high" --remove-label "review: medium-high" \
            --remove-label "review: medium-low" --remove-label "review: low" \
            --remove-label "review: approved" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL" \
            --repo ${{ github.repository }}
      - name: Severity gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json labels \
            --jq '[.labels[].name] | join(" ")' 2>/dev/null || echo "")
          echo "Labels: $LABELS"
          if echo "$LABELS" | grep -qF "review: high"; then
            echo "BLOCKED - CRITICAL issues found."
            exit 1
          fi
          if echo "$LABELS" | grep -qF "review: medium-high"; then
            echo "BLOCKED - HIGH issues found."
            exit 1
          fi
          echo "Gate passed."
  groq-on-demand-review:
    name: Groq On-Demand Review
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
