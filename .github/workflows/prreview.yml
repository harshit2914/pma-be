name: Gemini PR Review
# Model: gemini-2.5-flash (free tier via Google AI Studio)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  gemini-code-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure review labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "review: high"        --color "b60205" --description "CRITICAL - PR blocked"     --repo ${{ github.repository }} --force
          gh label create "review: medium-high" --color "e05d44" --description "HIGH - PR blocked"         --repo ${{ github.repository }} --force
          gh label create "review: medium-low"  --color "f4a224" --description "MEDIUM - warning only"     --repo ${{ github.repository }} --force
          gh label create "review: low"         --color "0075ca" --description "LOW - ok to merge"         --repo ${{ github.repository }} --force
          gh label create "review: approved"    --color "0e8a16" --description "No issues - good to merge" --repo ${{ github.repository }} --force

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr_diff.txt
          echo "Diff saved."

      - name: Write review script
        run: |
          cat > review.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const diff = fs.readFileSync('pr_diff.txt', 'utf8').slice(0, 30000);

          const prompt = [
            'You are a senior software engineer doing a thorough code review of a PR diff.',
            '',
            'Start with a one-sentence summary: what this PR changes and how many files are affected.',
            '',
            'Then output issues grouped into these sections (only include a section if it has issues):',
            '',
            '## Critical Issues',
            'For each CRITICAL or HIGH severity issue, number it and write:',
            '**N. Short descriptive title** `path/to/file.js:lineNumber`',
            '```diff',
            '- the bad line(s) from the diff',
            '+ the corrected replacement',
            '```',
            'Then 1-2 sentences: what exactly breaks or what security risk this introduces at runtime.',
            '',
            '## Moderate Issues',
            'For each MEDIUM or LOW severity issue, number it (continuing from Critical) and write:',
            '**N. Short descriptive title** `path/to/file.js:lineNumber`',
            '```diff',
            '- the bad line(s) from the diff',
            '+ the corrected replacement',
            '```',
            'Then 1 sentence: why it matters.',
            '',
            '## Verdict',
            'State which issue numbers are blocking merge and must be fixed. If none are blocking, say the PR is safe to merge.',
            '',
            'Severity classification rules:',
            '- CRITICAL: hardcoded secret, API key, password, or credential committed in code',
            '- HIGH: async function missing try/catch, auth middleware removed from a protected route, global error handler disabled, unhandled promise rejection, password stored or compared without hashing',
            '- MEDIUM: hardcoded string where an enum/constant exists, public route with no rate limiter, list endpoint returning all records with no pagination, N+1 database query, dead import left after removing a route',
            '- LOW: console.log left in production code, TODO/FIXME comment, magic number without a named constant, deprecated library method used',
            '',
            'VERY LAST LINE of your response must be exactly one of these labels (nothing else on that line):',
            'review: high',
            'review: medium-high',
            'review: medium-low',
            'review: low',
            'review: approved',
            '',
            'Label rules:',
            '- review: high        = any CRITICAL or HIGH issue found',
            '- review: medium-high = highest found is HIGH, no CRITICAL',
            '- review: medium-low  = highest found is MEDIUM',
            '- review: low         = only LOW issues found',
            '- review: approved    = no issues at all',
            '',
            'PR Diff:',
            '```',
            diff,
            '```'
          ].join('\n');

          const body = JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 4096
            }
          });

          const apiKey = process.env.GEMINI_API_KEY;
          const model = 'gemini-2.5-flash';
          const path = '/v1beta/models/' + model + ':generateContent?key=' + apiKey;

          const options = {
            hostname: 'generativelanguage.googleapis.com',
            path: path,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body)
            }
          };

          const req = https.request(options, function(res) {
            let data = '';
            res.on('data', function(chunk) { data += chunk; });
            res.on('end', function() {
              try {
                const parsed = JSON.parse(data);
                if (parsed.error) {
                  console.error('Gemini API error:', JSON.stringify(parsed.error));
                  process.exit(1);
                }
                const review = parsed.candidates[0].content.parts[0].text;
                if (!review) { console.error('No review text in response:', data); process.exit(1); }

                const lines = review.trim().split('\n').filter(function(l) { return l.trim(); });
                const lastLine = lines[lines.length - 1].trim();
                const validLabels = ['review: high', 'review: medium-high', 'review: medium-low', 'review: low', 'review: approved'];
                const label = validLabels.find(function(l) { return lastLine.includes(l); }) || 'review: low';

                fs.writeFileSync('review_comment.txt', review);
                fs.writeFileSync('review_label.txt', label);
                console.log('Review complete. Label: ' + label);
              } catch(e) {
                console.error('Parse error:', e.message);
                console.error('Raw response:', data);
                process.exit(1);
              }
            });
          });

          req.on('error', function(e) { console.error('Request error:', e.message); process.exit(1); });
          req.write(body);
          req.end();
          EOF

      - name: Review PR with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node review.js

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file review_comment.txt

      - name: Apply severity label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL=$(cat review_label.txt)
          echo "Applying label: $LABEL"
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "review: high" --remove-label "review: medium-high" \
            --remove-label "review: medium-low" --remove-label "review: low" \
            --remove-label "review: approved" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL" \
            --repo ${{ github.repository }}

      - name: Severity gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json labels \
            --jq '[.labels[].name] | join(" ")' 2>/dev/null || echo "")
          echo "Labels: $LABELS"
          if echo "$LABELS" | grep -qF "review: high"; then
            echo "BLOCKED - CRITICAL issues found."
            exit 1
          fi
          if echo "$LABELS" | grep -qF "review: medium-high"; then
            echo "BLOCKED - HIGH issues found."
            exit 1
          fi
          echo "Gate passed."

  gemini-on-demand-review:
    name: Gemini On-Demand Review
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@gemini review')
    permissions:
